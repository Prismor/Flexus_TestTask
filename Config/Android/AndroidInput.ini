; Android-only input. MUST be named AndroidInput.ini, not AndroidEngine.ini:
; UInputSettings is UCLASS(config=Input) (InputSettings.h:22), and the config
; layer "ProjectPlatform" resolves to {PROJECT}/Config/{PLATFORM}/{PLATFORM}{TYPE}.ini
; (ConfigHierarchy.h:33). The same keys placed in AndroidEngine.ini are silently
; ignored - they would look correct and do nothing.

[/Script/Engine.InputSettings]
; No virtual joysticks on the phone. They are not a style choice to remove:
; SVirtualJoystick claims two boxes in the bottom corners and Slate CONSUMES any
; touch landing on them, so GetInputTouchState never sees it - the paint brush
; and the sticks were fighting over the same finger. Note that the existing
; bAlwaysShowTouchInterface=False in DefaultInput.ini does NOT disable them: it
; is ORed with FAndroidMisc::GetUseVirtualJoysticks(), which is true on phones.
; The literal "None" makes FSoftObjectPath::SetPath call Reset(), so the
; IsValid() check at PlayerController.cpp:1213 fails and the widget is never
; built. Case matters - "none" would not work.
; Desktop keeps its sticks entry in Config/DefaultInput.ini, untouched.
DefaultTouchInterface=None

; With every touch now reaching the game, a stray four-finger tap would open the
; console over the demo and read as a crash. Default is True in DefaultInput.ini.
bShowConsoleOnFourFingerTap=False
