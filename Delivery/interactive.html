<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shader gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
  /* Light palette on bare :root - cool neutrals biased toward the teal
     signal accent taken from the water and displacement shaders. */
  :root {
    --ground:  #eef2f3;
    --surface: #ffffff;
    --line:    #d9e2e4;
    --ink:     #101a1d;
    --muted:   #5c6d73;
    --accent:  #0e7c74;
    --accent-soft: rgba(14, 124, 116, .10);
    --shadow:  0 1px 2px rgba(16, 26, 29, .05), 0 8px 24px rgba(16, 26, 29, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:  #0c1113;
      --surface: #141b1e;
      --line:    #222e32;
      --ink:     #e2eaec;
      --muted:   #84969c;
      --accent:  #4ecdc4;
      --accent-soft: rgba(78, 205, 196, .12);
      --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"] {
    --ground:  #0c1113;
    --surface: #141b1e;
    --line:    #222e32;
    --ink:     #e2eaec;
    --muted:   #84969c;
    --accent:  #4ecdc4;
    --accent-soft: rgba(78, 205, 196, .12);
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 56px 24px 80px;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

  header { display: flex; flex-direction: column; gap: 14px; max-width: 60ch; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin: 0;
  }
  h1 {
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    font-weight: 700; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.1;
    letter-spacing: -.02em; margin: 0; text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); }
  header p code {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .88em;
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 4px;
  }

  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 14px 16px 12px;
  }
  .card-head h2 {
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.005em;
  }
  .card-head .sub { display: block; font-family: "IBM Plex Sans", sans-serif;
    font-weight: 400; font-size: 13px; color: var(--muted); }
  .tag {
    flex: none; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .tag.static { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  canvas {
    touch-action: none;  /* a drag must paint, not scroll the page */
    width: 100%; aspect-ratio: 4 / 3; display: block;
    background: #05080a; border-block: 1px solid var(--line); cursor: crosshair;
  }
  canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card.static canvas { cursor: default; }

  .sliders { padding: 0 14px 12px; }
  .slider { margin-bottom: 9px; }
  .slider label { display:flex; justify-content:space-between; gap:8px;
    font-size:11.5px; color:#8b95a2; margin-bottom:4px; }
  .slider .sval { font-family:ui-monospace,monospace; color:#c3d3de; font-size:11px; }
  .slider input[type=range]{ width:100%; height:3px; -webkit-appearance:none;
    appearance:none; background:#2a313b; border-radius:2px; outline:none; }
  .slider input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;
    width:12px; height:12px; border-radius:50%; background:#7fb4d4; cursor:pointer; }
  .slider input[type=range]::-moz-range-thumb{ width:12px; height:12px; border:0;
    border-radius:50%; background:#7fb4d4; cursor:pointer; }
  .params {
    padding: 11px 16px 13px; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; line-height: 1.55; color: var(--muted);
    font-variant-numeric: tabular-nums; word-break: break-word;
  }
  .params .stat { margin-top: 5px; color: var(--accent); font-size: 11px; }
  .err {
    padding: 12px 16px; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; color: #d1495b; white-space: pre-wrap;
    border-top: 1px solid var(--line);
  }

  .code-toggle, .reset-btn {
    margin: 0 16px 13px; padding: 6px 10px; align-self: flex-start;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .04em; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
  }
  .code-toggle:hover, .reset-btn:hover { color: var(--ink); border-color: var(--accent); }
  .reset-btn { margin-bottom: 8px; }
  .codebox {
    display: none; margin: 0; padding: 14px 16px; max-height: 480px;
    overflow: auto; border-top: 1px solid var(--line);
    background: #05080a; color: #c3d3de;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; line-height: 1.6; white-space: pre;
  }
  .card.code-open .codebox { display: block; }

  footer { color: var(--muted); font-size: 13.5px; max-width: 68ch; }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9em;
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 4px;
  }
</style>

<div class="wrap">
  <header>
    <h1>Shader gallery</h1>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Levels 3&ndash;5 are a real ping-pong simulation &mdash; one buffer holds
    height, velocity and paint coverage, each frame reading the last. Drag to paint.
  </footer>
</div>

const EFFECTS = [{"name": "LVL1_Chameleon", "kind": "single", "image": "// HLSL -> GLSL compatibility shim.\n#define float2 vec2\n#define float3 vec3\n#define float4 vec4\n#define lerp  mix\n#define frac  fract\n#define atan2 atan\n#define saturate(x) clamp((x), 0.0, 1.0)\n\n// What a displaced surface hands back to the material pins.\nstruct LS_Surface\n{\n\tfloat3 Offset;    // World Position Offset (along the surface normal)\n\tfloat3 Normal;    // normal recalculated for the displaced shape\n\tfloat3 BaseColor;\n\tfloat3 Emissive;\n\tfloat  Roughness;\n};\n\nLS_Surface LS_ShadeChameleon(float3 worldNormal, float3 viewDir,\n                             float3 colorA, float3 colorB, float3 colorC,\n                             float roughA, float roughB, float roughC,\n                             float3 reflectionColor, float3 highlightColor,\n                             float reflectivity, float gradientBoost,\n                             float fresnelPower, float gradientShift)\n{\n\tfloat3 n = normalize(worldNormal);\n\tfloat3 v = normalize(viewDir);\n\tfloat ndotv = pow(saturate(dot(n, v)), max(gradientShift, 0.1));\n\n\t// same banding curve for roughness as for colour\n\tfloat roughLow  = lerp(roughA, roughB, smoothstep(0.0, 0.55, ndotv));\n\tfloat roughHigh = lerp(roughB, roughC, smoothstep(0.45, 1.0, ndotv));\n\n\tfloat3 colLow  = lerp(colorA, colorB, smoothstep(0.0, 0.55, ndotv));\n\tfloat3 colHigh = lerp(colorB, colorC, smoothstep(0.45, 1.0, ndotv));\n\n\tLS_Surface s;\n\ts.Offset = float3(0.0, 0.0, 0.0);\n\ts.Normal = n;\n\ts.Roughness = lerp(roughLow, roughHigh, smoothstep(0.45, 0.55, ndotv));\n\ts.BaseColor = lerp(colLow, colHigh, smoothstep(0.45, 0.55, ndotv));\n\n\tfloat fresnel = pow(1.0 - ndotv, max(fresnelPower, 0.1));\n\ts.Emissive = reflectionColor * highlightColor * fresnel * reflectivity\n\t           + s.BaseColor * gradientBoost;\n\treturn s;\n}\n\n// ============================== LVL 1 - Chameleon ==========================\n// Instance parameters: ColorA/B/C, RoughnessA/B/C, Reflectivity,\n// GradientBoost, FresnelPower, GradientShift, HighlightColor.\n// Rendered on an analytic sphere so the whole view-angle range is visible at\n// once - in the engine this material sits on real meshes.\n\n\n\n\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord)\n{\n    vec2 p = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n\n    // ray-sphere intersection (sphere at origin, radius 1, camera on -Z)\n    vec3 ro = vec3(0.0, 0.0, -3.0);\n    vec3 rd = normalize(vec3(p, 1.5));\n    float b = dot(ro, rd);\n    float c = dot(ro, ro) - 1.0;\n    float disc = b * b - c;\n\n    vec3 col = vec3(0.02, 0.02, 0.025);   // studio backdrop\n\n    if (disc > 0.0)\n    {\n        float dist = -b - sqrt(disc);\n        vec3 pos = ro + rd * dist;\n\n        vec3 n = normalize(pos);\n        vec3 V = -rd;\n\n        // stand-in for the cubemap: a soft two-light studio environment\n        vec3 R = reflect(-V, n);\n        float sky = saturate(R.y * 0.5 + 0.5);\n        vec3 reflection = mix(vec3(0.05, 0.06, 0.08), vec3(0.85, 0.90, 1.0), sky);\n\n        LS_Surface s = LS_ShadeChameleon(n, V,\n            vec3(1.00, 0.25, 0.85),   // ColorA - grazing magenta\n            vec3(0.50, 0.20, 0.95),   // ColorB - violet\n            vec3(0.00, 0.95, 1.00),   // ColorC - facing cyan\n            0.25, 0.15, 0.10,         // RoughnessA/B/C\n            reflection,\n            vec3(1.0),                // HighlightColor\n            LSDEMO_REFLECTIVITY,\n            LSDEMO_GRADIENT_BOOST,\n            LSDEMO_FRESNEL_POWER,\n            LSDEMO_GRADIENT_SHIFT);\n\n        vec3 L = normalize(vec3(0.5, 0.7, -0.6));\n        float diffuse = max(dot(n, L), 0.0);\n        float shininess = mix(16.0, 200.0, 1.0 - s.Roughness);\n        float specular = pow(max(dot(reflect(-L, n), V), 0.0), shininess);\n\n        col = s.BaseColor * (0.2 + 0.8 * diffuse)\n            + vec3(1.0) * specular * (1.0 - s.Roughness)\n            + s.Emissive;\n    }\n\n    col = col / (1.0 + col);\n    col = pow(col, vec3(1.0 / 2.2));\n    fragColor = vec4(col, 1.0);\n}\n", "buffer": null, "display": "// HLSL -> GLSL compatibility shim.\n#define float2 vec2\n#define float3 vec3\n#define float4 vec4\n#define lerp  mix\n#define frac  fract\n#define atan2 atan\n#define saturate(x) clamp((x), 0.0, 1.0)\n\n// What a displaced surface hands back to the material pins.\nstruct LS_Surface\n{\n\tfloat3 Offset;    // World Position Offset (along the surface normal)\n\tfloat3 Normal;    // normal recalculated for the displaced shape\n\tfloat3 BaseColor;\n\tfloat3 Emissive;\n\tfloat  Roughness;\n};\n\nLS_Surface LS_ShadeChameleon(float3 worldNormal, float3 viewDir,\n                             float3 colorA, float3 colorB, float3 colorC,\n                             float roughA, float roughB, float roughC,\n                             float3 reflectionColor, float3 highlightColor,\n                             float reflectivity, float gradientBoost,\n                             float fresnelPower, float gradientShift)\n{\n\tfloat3 n = normalize(worldNormal);\n\tfloat3 v = normalize(viewDir);\n\tfloat ndotv = pow(saturate(dot(n, v)), max(gradientShift, 0.1));\n\n\t// same banding curve for roughness as for colour\n\tfloat roughLow  = lerp(roughA, roughB, smoothstep(0.0, 0.55, ndotv));\n\tfloat roughHigh = lerp(roughB, roughC, smoothstep(0.45, 1.0, ndotv));\n\n\tfloat3 colLow  = lerp(colorA, colorB, smoothstep(0.0, 0.55, ndotv));\n\tfloat3 colHigh = lerp(colorB, colorC, smoothstep(0.45, 1.0, ndotv));\n\n\tLS_Surface s;\n\ts.Offset = float3(0.0, 0.0, 0.0);\n\ts.Normal = n;\n\ts.Roughness = lerp(roughLow, roughHigh, smoothstep(0.45, 0.55, ndotv));\n\ts.BaseColor = lerp(colLow, colHigh, smoothstep(0.45, 0.55, ndotv));\n\n\tfloat fresnel = pow(1.0 - ndotv, max(fresnelPower, 0.1));\n\ts.Emissive = reflectionColor * highlightColor * fresnel * reflectivity\n\t           + s.BaseColor * gradientBoost;\n\treturn s;\n}\n\n// ============================== LVL 1 - Chameleon ==========================\n// Instance parameters: ColorA/B/C, RoughnessA/B/C, Reflectivity,\n// GradientBoost, FresnelPower, GradientShift, HighlightColor.\n// Rendered on an analytic sphere so the whole view-angle range is visible at\n// once - in the engine this material sits on real meshes.\n\n\n\n\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord)\n{\n    vec2 p = (2.0 * fragCoord - iResolution.xy) / iResolution.y;\n\n    // ray-sphere intersection (sphere at origin, radius 1, camera on -Z)\n    vec3 ro = vec3(0.0, 0.0, -3.0);\n    vec3 rd = normalize(vec3(p, 1.5));\n    float b = dot(ro, rd);\n    float c = dot(ro, ro) - 1.0;\n    float disc = b * b - c;\n\n    vec3 col = vec3(0.02, 0.02, 0.025);   // studio backdrop\n\n    if (disc > 0.0)\n    {\n        float dist = -b - sqrt(disc);\n        vec3 pos = ro + rd * dist;\n\n        vec3 n = normalize(pos);\n        vec3 V = -rd;\n\n        // stand-in for the cubemap: a soft two-light studio environment\n        vec3 R = reflect(-V, n);\n        float sky = saturate(R.y * 0.5 + 0.5);\n        vec3 reflection = mix(vec3(0.05, 0.06, 0.08), vec3(0.85, 0.90, 1.0), sky);\n\n        LS_Surface s = LS_ShadeChameleon(n, V,\n            vec3(1.00, 0.25, 0.85),   // ColorA - grazing magenta\n            vec3(0.50, 0.20, 0.95),   // ColorB - violet\n            vec3(0.00, 0.95, 1.00),   // ColorC - facing cyan\n            0.25, 0.15, 0.10,         // RoughnessA/B/C\n            reflection,\n            vec3(1.0),                // HighlightColor\n            LSDEMO_REFLECTIVITY,\n            LSDEMO_GRADIENT_BOOST,\n            LSDEMO_FRESNEL_POWER,\n            LSDEMO_GRADIENT_SHIFT);\n\n        vec3 L = normalize(vec3(0.5, 0.7, -0.6));\n        float diffuse = max(dot(n, L), 0.0);\n        float shininess = mix(16.0, 200.0, 1.0 - s.Roughness);\n        float specular = pow(max(dot(reflect(-L, n), V), 0.0), shininess);\n\n        col = s.BaseColor * (0.2 + 0.8 * diffuse)\n 0, uv + vec2(tapD, 0.0)).r\n                      + texture(iChannel0, uv - vec2(tapD, 0.0)).r\n                      + texture(iChannel0, uv + vec2(0.0, tapD)).r\n                      + texture(iChannel0, uv - vec2(0.0, tapD)).r);\n\n    LS_BrushParams brush;\n    brush.Pos = iMouse.xy / iResolution.xy;\n    // Shadertoy exposes no previous-frame mouse, so the capsule collapses to\n    // a point here. In Unreal the controller passes the real previous UV\n    // (see LiquidSimPaintController.cpp) and fast strokes stay continuous.\n    brush.PrevPos = brush.Pos;\n    brush.Radius = LSDEMO_BRUSH_RADIUS;\n    brush.Softness = LSDEMO_BRUSH_SOFTNESS;\n    brush.Depth = LSDEMO_BRUSH_DEPTH;\n    brush.RimHeight = LSDEMO_BRUSH_RIM;\n    brush.RimOffset = 1.2;\n    brush.RimWidth = 0.4;\n    brush.Raggedness = LSDEMO_RAGGEDNESS;\n    brush.Strength = (iMouse.z > 0.0) ? 1.0 : 0.0;\n\n    LS_SimParams sim;\n    sim.Decay = LSDEMO_DECAY;\n    sim.DecayVariation = LSDEMO_DECAY_VAR;\n    sim.Viscosity = LSDEMO_VISCOSITY;\n    sim.SpringDamp = 0.995;\n    sim.VelocityMax = 0.5;\n    sim.Smoothing = LSDEMO_SMOOTHING;\n    sim.WetnessDecay = LSDEMO_WETNESS_DECAY;\n    sim.MaxHeight = 0.5;\n    sim.DeltaTime = min(iTimeDelta, 0.05);\n\n    fragColor = vec4(LS_PaintStep(prev, avg, uv, brush, sim), 1.0);\n}\n\n*/\n", "decls": "uniform float LSDEMO_BRUSH_DEPTH;\nuniform float LSDEMO_BRUSH_RADIUS;\nuniform float LSDEMO_BRUSH_RIM;\nuniform float LSDEMO_BRUSH_SOFTNESS;\nuniform float LSDEMO_RAGGEDNESS;", "sliders": [{"name": "LSDEMO_BRUSH_DEPTH", "label": "Brush depth", "min": 0.0, "max": 12.0, "step": 0.1, "value": 1.2}, {"name": "LSDEMO_BRUSH_RADIUS", "label": "Brush radius", "min": 0.01, "max": 0.25, "step": 0.005, "value": 0.07}, {"name": "LSDEMO_BRUSH_RIM", "label": "Rim", "min": 0.0, "max": 3.0, "step": 0.05, "value": 0.35}, {"name": "LSDEMO_BRUSH_SOFTNESS", "label": "Brush softness", "min": 0.2, "max": 3.0, "step": 0.05, "value": 0.9}, {"name": "LSDEMO_RAGGEDNESS", "label": "Ragge d surface hands back to the material pins.\nstruct LS_Surface\n{\n\tfloat3 Offset;    // World Position Offset (along the surface normal)\n\tfloat3 Normal;    // normal recalculated for the displaced shape\n\tfloat3 BaseColor;\n\tfloat3 Emissive;\n\tfloat  Roughness;\n};\n\n// Hash helpers (Dave Hoskins style): cheap pseudo-random from a position.\n// No textures and no sin() - so no visible periodicity or platform drift.\nfloat LS_Hash31(float3 p)\n{\n\tp = frac(p * 0.1031);\n\tp += dot(p, p.zyx + 31.32);\n\treturn frac((p.x + p.y) * p.z);\n}\n\n// Value noise: random value per lattice corner, smoothly interpolated. [-1,1]\nfloat LS_ValueNoise(float3 p)\n{\n\tfloat3 i = floor(p);\n\tfloat3 f = frac(p);\n\tfloat3 u = f * f * (3.0 - 2.0 * f); // smoothstep weights\n\n\tfloat c000 = LS_Hash31(i + float3(0.0, 0.0, 0.0));\n\tfloat c100 = LS_Hash31(i + float3(1.0, 0.0, 0.0));\n\tfloat c010 = LS_Hash31(i + float3(0.0, 1.0, 0.0));\n\tfloat c110 = LS_Hash31(i + float3(1.0, 1.0, 0.0));\n\tfloat c001 = LS_Hash31(i + float3(0.0, 0.0, 1.0));\n\tfloat c101 = LS_Hash31(i + float3(1.0, 0.0, 1.0));\n\tfloat c011 = LS_Hash31(i + float3(0.0, 1.0, 1.0));\n\tfloat c111 = LS_Hash31(i + float3(1.0, 1.0, 1.0));\n\n\tfloat n = lerp(\n\t\tlerp(lerp(c000, c100, u.x), lerp(c010, c110, u.x), u.y),\n\t\tlerp(lerp(c001, c101, u.x), lerp(c011, c111, u.x), u.y),\n\t\tu.z);\n\treturn n * 2.0 - 1.0;\n}\n\n// 3-stop gradient by a normalised value t (0 = lowest, 1 = highest).\n// Wide overlapping crossfades - the two halves never show a seam.\nfloat3 LS_HeightRamp(float t, float3 low, float3 mid, float3 high)\n{\n\tfloat3 a = lerp(low, mid, smoothstep(0.0, 0.65, t));\n\tfloat3 b = lerp(mid, high, smoothstep(0.35, 1.0, t));\n\treturn lerp(a, b, smoothstep(0.3, 0.7, t));\n}\n\n// Central differences: cross the edge vectors from two nearby height taps to get the\n// true displaced normal (the engine's own normal still thinks the surface is flat).\nvoid LS_SurfaceFromHeights(float3 worldNormal, float hCenter, float hTapU, float hTapV,\n                           out float3 outOffset, out float3 outNormal)\n{\n\tfloat tapDistance = 5.0; // cm between taps in world space\n\n\tfloat3 n = normalize(worldNormal);\n\tfloat3 t = float3(1.0, 0.0, 0.0);\n\tfloat3 b = float3(0.0, 1.0, 0.0);\n\n\tfloat3 posC = n * hCenter;\n\tfloat3 posU = t * tapDistance + n * hTapU;\n\tfloat3 posV = b * tapDistance + n * hTapV;\n\n\toutOffset = posC;\n\toutNormal = normalize(cross(posV - posC, posU - posC));\n\n\tif (dot(outNormal, n) < 0.0) { outNormal = -outNormal; }\n}\n\nfloat3 LS_PaintStep(float3 prevHVW, float neighbourAvgH, float2 uv,\n                    LS_BrushParams brush, LS_SimParams sim)\n{\n\tfloat h = prevHVW.r;\n\tfloat v = prevHVW.g;\n\tfloat w = prevHVW.b;\n\n\t// --- viscous relaxation: round off edges left by fast strokes ---------\n\th = lerp(h, neighbourAvgH, saturate(sim.Smoothing));\n\n\tfloat jitter = LS_ValueNoise(float3(uv * 9.0, 3.0)) * sim.DecayVariation;\n\tfloat decay = saturate(sim.Decay - abs(jitter));\n\n\tfloat viscosity = min(sim.Viscosity, 2.0);\n\n\tv = (v + (neighbourAvgH - h) * viscosity) * decay * saturate(sim.SpringDamp);\n\tv = clamp(v, -sim.VelocityMax, sim.VelocityMax); // no overshoot spikes\n\th = (h + v) * decay;\n\n\tfloat2 fromCentre = abs(uv - 0.5) * 2.0;\n\tfloat edgeDist = max(fromCentre.x, fromCentre.y);\n\tfloat edge = 1.0 - smoothstep(0.82, 1.0, edgeDist);\n\tv *= edge;\n\th *= edge;\n\n\tfloat2 seg = brush.Pos - brush.PrevPos;\n\tfloat segLen2 = dot(seg, seg);\n\tfloat segT = (segLen2 > 0.00000001) ? saturate(dot(uv - brush.PrevPos, seg) / segLen2) : 0.0;\n\tfloat dist = length(uv - (brush.PrevPos + seg * segT));\n\n\t// gaussian dent, optionally torn at the border by high-frequency noise\n\tfloat tear = 0.5 + 0.5 * LS_ValueNoise(float3(uv * 55.0, 1.0));\n\tfloat dent = exp(-(dist * dist) / max(brush.Radius * brush.Radius * brush.Softness, 0.000001));\n\tdent *= lerp(1.0, tear, saturate(brush.Raggedness));\n\n\t// gaussian ring just o const VS = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

function fsWrap(body, decls){
  return `#version 300 es
precision highp float;
precision highp sampler2D;
uniform vec3  iResolution;
uniform float iTime;
uniform float iTimeDelta;
uniform int   iFrame;
uniform vec4  iMouse;
uniform vec4  iMousePrev;
uniform sampler2D iChannel0;
${decls || ''}
out vec4 _fragColor;
${body}
void main(){ vec4 c; mainImage(c, gl_FragCoord.xy); _fragColor = c; }`;
}

function compile(gl, type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    throw new Error(log);
  }
  return sh;
}

function program(gl, fsSrc, decls){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsWrap(fsSrc, decls)));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function uniforms(gl, p){
  return {
    res:   gl.getUniformLocation(p, 'iResolution'),
    time:  gl.getUniformLocation(p, 'iTime'),
    dt:    gl.getUniformLocation(p, 'iTimeDelta'),
    frame: gl.getUniformLocation(p, 'iFrame'),
    mouse: gl.getUniformLocation(p, 'iMouse'),
    mousePrev: gl.getUniformLocation(p, 'iMousePrev'),
    chan:  gl.getUniformLocation(p, 'iChannel0'),
  };
}

function makeTarget(gl, w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex, fbo};
}

function showErr(card, msg){
  const d = document.createElement('div');
  d.className = 'err';
  d.textContent = msg;
  card.appendChild(d);
}

function boot(card, eff){
  const canvas = card.querySelector('canvas');
  const gl = canvas.getContext('webgl2', {antialias:false, alpha:false});
  if (!gl) { showErr(card, 'WebGL2 is unavailable in this browser.'); return; }
  if (eff.kind === 'sim' && !gl.getExtension('EXT_color_buffer_float')) {
    showErr(card, 'Float render targets are unavailable, so the simulation cannot run here.');
    return;

  try {
    imgProg = program(gl, eff.image, eff.decls);

    live[sp.name] = {

      img: gl.getUniformLocation(imgProg, sp.name),
      buf: bufProg ? gl.getUniformLocation(bufProg, sp.name) : null

    const nm = document.createElement('span'); nm.textContent = sp.label;
    const vv = document.createElement('span'); vv.className = 'sval';
    vv.textContent = (+sp.value).toFixed(3);
    lab.appendChild(nm); lab.appendChild(vv);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = sp.min; inp.max = sp.max;
    inp.step = sp.step; inp.value = sp.value;
    inp.addEventListener('input', function(){
      live[sp.name].value = parseFloat(inp.value);
      vv.textContent = parseFloat(inp.value).toFixed(3);
    });
    row.appendChild(lab); row.appendChild(inp);
    sliderBox.appendChild(row);
  });
  function applyLive(which){
    for (const k in live) {
      const loc = live[k][which];
      if (loc) gl.uniform1f(loc, live[k].value);
    }
  }

  // Only render while the card is actually on screen. Eight shaders of this
  // weight running at once choke an integrated GPU - the page looked frozen on
  // weaker machines even though every shader had compiled fine.
  let visible = true;
  if ('IntersectionObserver' in window) {
    visible = false;
    new IntersectionObserver(function(entries){
      visible = entries[0].isIntersecting;
    }, {rootMargin: '80px'}).observe(canvas);
  }

  const uImg = uniforms(gl, imgProg);
  const uBuf = bufProg ? uniforms(gl, bufProg) : null;

  let W = 0, H = 0, targets = null, cur = 0, frame = 0;
  const mouse = {x:0, y:0, px:0, py:0, down:0};

  // LVL3's paint never decays by design ("stays forever"), so a long play
  // session just fills the canvas solid - frame 0 is the buffer shader's own
  // signal to treat the target as empty, so rewinding to it clears the paint
  // without touching the compiled programs or resizing anything.
  card.resetSim = function(){ frame = 0; };

  canvas.addEventListener('pointerdown', e => {
    mouse.down = 1;
    canvas.setPointerCapture(e.pointerId);
    move(e); mouse.px = mouse.x; mouse.py = mouse.y;
  });
  canvas.addEventListener('pointerup', () => { mouse.down = 0; });
  canvas.addEventListener('pointercancel', () => { mouse.down = 0; });
  canvas.addEventListener('pointermove', move);
  function move(e){
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) / r.width * W;
    mouse.y = (1 - (e.clientY - r.top) / r.height) * H;
  }

  function resize(){
    const r = canvas.getBoundingClientRect();
    const w = Math.max(2, Math.floor(r.width * 0.8));
    const h = Math.max(2, Math.floor(w * 3 / 4));
    if (w === W && h === H) return;
    W = w; H = h; canvas.width = W; canvas.height = H;
    if (bufProg) { targets = [makeTarget(gl, W, H), makeTarget(gl, W, H)]; frame = 0; }
  }

  let last = performance.now(), t0 = performance.now();

  function render(now){
    if (!card.isConnected) return;
    resize();
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const time = (now - t0) / 1000;

    gl.bindVertexArray(vao);

    if (bufProg) {
      const src = targets[cur], dst = targets[1 - cur];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
      gl.viewport(0, 0, W, H);
      gl.useProgram(bufProg);
      gl.uniform3f(uBuf.res, W, H, 1);
      gl.uniform1f(uBuf.time, time);
      gl.uniform1f(uBuf.dt, dt);
      gl.uniform1i(uBuf.frame, frame);
      gl.uniform4f(uBuf.mouse, mouse.x, mouse.y, mouse.down, 0);
      applyLive('buf');
      gl.uniform4f(uBuf.mousePrev, mouse.px, mouse.py, mouse.down, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform1i(uBuf.chan, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      cur = 1 - cur;
      mouse.px = mouse.x; mouse.py = mouse.y;
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(imgProg);
    gl.uniform3f(uImg.res, W, H, 1);
    gl.uniform1f(uImg.time, time);
    gl.uniform1f(uImg.dt, dt);
    gl.uniform1i(uImg.frame, frame);
    gl.uniform4f(uImg.mouse, mouse.x, mouse.y, mouse.down, 0);
    gl.uniform4f(uImg.mousePrev, mouse.px, mouse.py, mouse.down, 0);
    applyLive('img');
    if (bufProg) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, targets[cur].tex);
      gl.uniform1i(uImg.chan, 0);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    frame++;
    // Reduced motion: draw a few frames so the panel is not blank, then hold.
    if (!visible) { setTimeout(() => requestAnimationFrame(render), 250); return; }
    if (REDUCED && frame > 3 && !mouse.down) { setTimeout(() => requestAnimationFrame(render), 400); return; }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

const grid = document.getElementById('grid');
for (const eff of EFFECTS) {
  const isSim = eff.kind === 'sim';
  const card = document.createElement('div');
  card.className = 'card' + (isSim ? '' : ' static');
  const level = eff.name.slice(0, 4);
  const title = eff.name.slice(5).replace(/([a-z])([A-Z])/g, '$1 $2');
  // Only LVL3's paint never decays ("stays forever" is the whole point of
  // that level) - LVL4/LVL5 already fade on their own, so a reset button
  // there would just be noise.
  const needsReset = level === 'LVL3';
  card.innerHTML =
    '<div class="card-head">' +
      '<h2>' + level + ' &middot; ' + title + '<span class="sub">' + eff.subtitle + '</span></h2>' +
      '<span class="tag' + (isSim ? '' : ' static') + '">' + (isSim ? 'Interactive' : 'Procedural') + '</span>' +
    '</div>' +
    '<canvas tabindex="0" aria-label="' + title + ' shader preview"></canvas>' +
    '<div class="params">' + eff.params +
      (eff.stat ? '<div class="stat">' + eff.stat + '</div>' : '') + '</div>' +
    '<div class="sliders"></div>' +
    (needsReset ? '<button type="button" class="reset-btn">Reset</button>' : '') +
    '<button type="button" class="code-toggle">Show GLSL</button>' +
    '<pre class="codebox"><code></code></pre>';
  grid.appendChild(card);
  boot(card, eff);

  if (needsReset) {
    card.querySelector('.reset-btn').addEventListener('click', function(){
      card.resetSim();
    });
  }

  // Code is the same GLSL that just got compiled above - set once, on first
  // open, instead of bloating every card's HTML with it up front.
  const btn = card.querySelector('.code-toggle');
  const box = card.querySelector('.codebox code');
  let codeLoaded = false;
  btn.addEventListener('click', function(){
    const open = card.classList.toggle('code-open');
    btn.textContent = open ? 'Hide GLSL' : 'Show GLSL';
    if (open && !codeLoaded) {
      box.textContent = eff.display;
      codeLoaded = true;
    }
  });
}
</script>
