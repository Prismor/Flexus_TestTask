; The phone boots into the mobile copy of the level: same layout, but wired to
; the cheap material instances. The desktop level stays the startup map
; everywhere else.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/LiquidSim/Maps/L_FlexusTest_Mobile.L_FlexusTest_Mobile

; Installs the station-picker HUD. Set here rather than on the level's
; WorldSettings because AWorldSettings is not returned by
; EditorActorSubsystem.get_all_level_actors(), so the Python build script cannot
; reach it - and doing it per-platform keeps the desktop level on the engine
; default game mode anyway.
GlobalDefaultGameMode=/Script/FlexusTestTask.LiquidSimGameMode

; The phone build is a demo the client watches, not a dev session: the red
; "LIGHTING NEEDS TO BE REBUILT" / SkyAtmosphere warnings sit right across the
; effects and make a working build look broken. Editor and desktop builds keep
; showing them.
[/Script/Engine.Engine]
bEnableOnScreenDebugMessages=False

; Architecture, pinned per-platform. The same keys in DefaultEngine.ini were not
; enough: a BuildCookRun still produced an x86_64-only APK (lib/x86_64/, ELF
; e_machine 0x3E), which no phone can install. Platform config wins over the
; project default, so the intent is restated here.
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bBuildForArm64=True
bBuildForX8664=False

; Android-only render settings. Kept in Config/Android/ so the desktop look in
; DefaultEngine.ini (Lumen, virtual shadow maps, DX12) stays untouched - none
; of those exist on a phone, and leaving them on would either fail to compile
; or silently fall back.
[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.MobileHDR=True
r.Mobile.EnableStaticAndCSMShadowReceivers=0
r.Mobile.AllowDistanceFieldShadows=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.DefaultFeature.MotionBlur=False
; Fixed exposure. The mobile level has no PostProcessVolume (it was removed as
; useless on the mobile renderer), so auto-exposure was live: on a dark scene
; like the lava it lifted the whole image, which turned near-black basalt into
; light brown and pushed the molten channels to clipped white. Locking it makes
; the material's own values what you actually see.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.EyeAdaptation.MethodOverride=2

r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
