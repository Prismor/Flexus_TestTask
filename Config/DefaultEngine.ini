; Lumen GI + Lumen reflections + virtual shadow maps on DX12/SM6 - the
; "quality knobs" pass: glossy liquid surfaces get real reflections and
; soft contact shadows. First editor start after this change recompiles a
; lot of shaders - expect a long load once.
; XGE shader distribution hangs on this machine: Incredibuild is on PATH but not
; licensed, so the engine picks the XGE controller, then waits forever on an
; XGEControlWorker.exe that does not exist. Interactive launches pass
; -noxgeshadercompile, but a cook started by UAT is a separate process that
; never sees that switch - so the CVar is pinned here instead. It has to live in
; [ConsoleVariables] (applied during engine PreInit), NOT in RendererSettings,
; which only maps declared UPROPERTYs and would silently ignore it.
[ConsoleVariables]
r.XGEShaderCompile=0

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True

